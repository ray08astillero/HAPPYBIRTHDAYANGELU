<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">



    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >



    <title>

        Happy Birthday Angelu 🎂

    </title>





    <style>



        /* =========================================================

           GENERAL

        ========================================================= */



        * {

            box-sizing: border-box;

        }



        html {

            scroll-behavior: smooth;

        }



        body {

            margin: 0;



            font-family:

                "Trebuchet MS",

                Arial,

                sans-serif;



            background: #fff7f8;



            color: #633c50;



            overflow-x: hidden;

        }



        button {

            font-family: inherit;

        }



        .hidden {

            display: none !important;

        }





        /* =========================================================

           OPENING SCREEN

        ========================================================= */



        #intro {

            position: fixed;



            inset: 0;



            z-index: 9999;



            display: flex;



            justify-content: center;



            align-items: center;



            background:



                radial-gradient(

                    circle at 20% 20%,

                    #ffd5e4 0%,

                    transparent 25%

                ),



                radial-gradient(

                    circle at 80% 30%,

                    #fff0a8 0%,

                    transparent 25%

                ),



                radial-gradient(

                    circle at 50% 90%,

                    #d8f4ff 0%,

                    transparent 30%

                ),



                #fff7f8;



            transition:

                opacity

                0.8s

                ease;

        }





        .tap-button {

            border: none;



            background: transparent;



            color: #ec5b91;



            font-size:

                clamp(

                    2.5rem,

                    8vw,

                    5rem

                );



            font-weight: bold;



            cursor: pointer;



            animation:

                tapPulse

                1.8s

                infinite;

        }





        .tap-button::after {

            content: " ✨";

        }





        @keyframes tapPulse {



            0%,

            100% {



                transform:

                    scale(1);



                opacity: 0.65;

            }





            50% {



                transform:

                    scale(1.08);



                opacity: 1;

            }



        }





        /* =========================================================

           MAIN PAGE

        ========================================================= */



        #mainPage {

            min-height: 100vh;



            position: relative;



            overflow: hidden;



            background:



                radial-gradient(

                    circle at 5% 5%,

                    #ffd2e0 0%,

                    transparent 20%

                ),



                radial-gradient(

                    circle at 95% 10%,

                    #ffe58a 0%,

                    transparent 20%

                ),



                radial-gradient(

                    circle at 10% 80%,

                    #d8f1ff 0%,

                    transparent 20%

                ),



                radial-gradient(

                    circle at 90% 75%,

                    #e7d8ff 0%,

                    transparent 20%

                ),



                linear-gradient(

                    135deg,

                    #fff9f5,

                    #fff3f7

                );

        }





        /* =========================================================

           BALLOONS

        ========================================================= */



        .balloon {



            position: absolute;



            font-size: 65px;



            z-index: 1;



            pointer-events: none;



            animation:

                balloonFloat

                5s

                ease-in-out

                infinite;

        }





        .balloon1 {

            left: 3%;

            top: 8%;

        }





        .balloon2 {

            right: 4%;

            top: 12%;



            animation-delay: 1s;

        }





        .balloon3 {

            left: 7%;

            top: 52%;



            animation-delay: 2s;

        }





        .balloon4 {

            right: 7%;

            top: 55%;



            animation-delay: 1.5s;

        }





        .balloon5 {

            left: 45%;

            top: 5%;



            animation-delay: 0.5s;

        }





        @keyframes balloonFloat {



            0%,

            100% {



                transform:

                    translateY(0)

                    rotate(-4deg);

            }





            50% {



                transform:

                    translateY(-25px)

                    rotate(5deg);

            }



        }





        /* =========================================================

           HERO

        ========================================================= */



        .hero {



            position: relative;



            z-index: 3;



            min-height: 620px;



            display: flex;



            flex-direction: column;



            justify-content: center;



            align-items: center;



            padding:

                55px

                20px

                25px;



            text-align: center;

        }





        /* =========================================================

           DECORATIVE STARS

        ========================================================= */



        .star {



            position: absolute;



            color: #ffc43d;



            font-size: 35px;



            pointer-events: none;



            animation:

                sparkle

                2s

                infinite;

        }





        .star1 {

            left: 18%;

            top: 18%;

        }





        .star2 {

            right: 20%;

            top: 25%;



            animation-delay: 0.6s;

        }





        .star3 {

            left: 25%;

            bottom: 10%;



            animation-delay: 1s;

        }





        .star4 {

            right: 25%;

            bottom: 8%;



            animation-delay: 1.4s;

        }





        @keyframes sparkle {



            0%,

            100% {



                transform:

                    scale(0.8)

                    rotate(0deg);



                opacity: 0.5;

            }





            50% {



                transform:

                    scale(1.3)

                    rotate(20deg);



                opacity: 1;

            }



        }





        /* =========================================================

           CELEBRANT PHOTO

        ========================================================= */



        .celebrant-frame {



            width:

                min(

                    360px,

                    72vw

                );



            height:

                min(

                    420px,

                    75vw

                );



            position: relative;



            border-radius:

                45%

                45%

                35%

                35%;



            background: #ffd6e5;



            padding: 8px;



            box-shadow:



                0

                15px

                35px

                rgba(

                    220,

                    90,

                    140,

                    0.25

                ),



                0

                0

                0

                12px

                rgba(

                    255,

                    255,

                    255,

                    0.7

                );



            transform:

                rotate(-2deg);



            animation:

                photoAppear

                1s

                ease;

        }





        .celebrant-frame img {



            width: 100%;



            height: 100%;



            object-fit: cover;



            border-radius:

                40%

                40%

                30%

                30%;



            display: block;

        }





        @keyframes photoAppear {



            from {



                opacity: 0;



                transform:

                    scale(0.7)

                    rotate(-8deg);

            }





            to {



                opacity: 1;



                transform:

                    scale(1)

                    rotate(-2deg);

            }



        }





        /* =========================================================

           BIRTHDAY TITLE

        ========================================================= */



        .birthday-title {



            margin-top: 30px;



            font-size:

                clamp(

                    2.3rem,

                    7vw,

                    5.5rem

                );



            line-height: 0.9;



            font-weight: 900;



            letter-spacing: 1px;



            transform:

                rotate(-1deg);

        }





        .birthday-title .happy {



            display: block;



            color: #ed5d91;



            text-shadow:



                3px

                3px

                0

                #fff,



                5px

                5px

                0

                #ffd1df;

        }





        .birthday-title .birthday {



            display: block;



            color: #f5a91b;



            text-shadow:



                3px

                3px

                0

                #fff,



                5px

                5px

                0

                #ffe7a7;

        }





        .birthday-title .name {



            display: inline-block;



            margin-top: 8px;



            padding:

                10px

                35px;



            color: white;



            background: #ed5d91;



            clip-path:



                polygon(

                    0 15%,

                    8% 0,

                    92% 0,

                    100% 15%,

                    94% 50%,

                    100% 85%,

                    92% 100%,

                    8% 100%,

                    0 85%,

                    6% 50%

                );

        }





        /* =========================================================

           MUSIC PLAYER

        ========================================================= */



        .music-player {



            width:

                min(

                    500px,

                    90vw

                );



            margin:

                22px

                auto;



            display: flex;



            align-items: center;



            gap: 12px;



            padding:

                13px

                20px;



            border-radius: 50px;



            background:

                rgba(

                    255,

                    255,

                    255,

                    0.9

                );



            border:

                3px

                solid

                #ffb9d1;



            box-shadow:



                0

                8px

                25px

                rgba(

                    220,

                    100,

                    150,

                    0.15

                );

        }





        .music-icon {

            font-size: 28px;

        }





        .music-info {



            flex: 1;



            text-align: left;

        }





        .music-title {



            font-weight: bold;



            color: #ec5b91;

        }





        .music-bar {



            height: 7px;



            margin-top: 6px;



            border-radius: 20px;



            background: #ffd9e6;



            overflow: hidden;

        }





        .music-progress {



            width: 35%;



            height: 100%;



            background: #ed5d91;



            border-radius: 20px;



            animation:

                musicProgress

                4s

                linear

                infinite;

        }





        @keyframes musicProgress {



            from {

                width: 5%;

            }



            to {

                width: 95%;

            }



        }





        .music-control {



            width: 48px;



            height: 48px;



            border: none;



            border-radius: 50%;



            background: #ed5d91;



            color: white;



            font-size: 20px;



            cursor: pointer;

        }





        /* =========================================================

           BUTTON GRID

        ========================================================= */



        .button-grid {



            position: relative;



            z-index: 5;



            width:

                min(

                    950px,

                    92vw

                );



            margin:

                5px

                auto

                60px;



            display: grid;



            grid-template-columns:

                repeat(

                    4,

                    1fr

                );



            gap: 18px;

        }





        .menu-btn {



            min-height: 125px;



            border-radius: 30px;



            cursor: pointer;



            border:

                3px

                solid;



            background:

                rgba(

                    255,

                    255,

                    255,

                    0.82

                );



            box-shadow:



                0

                10px

                25px

                rgba(

                    180,

                    100,

                    140,

                    0.13

                );



            display: flex;



            flex-direction: column;



            justify-content: center;



            align-items: center;



            gap: 9px;



            font-weight: bold;



            font-size: 45px;



            transition: 0.25s;

        }





        .menu-btn span {



            font-size: 17px;



            font-weight: bold;

        }





        .menu-btn:hover {



            transform:

                translateY(-8px)

                rotate(-1deg);



            box-shadow:



                0

                18px

                35px

                rgba(

                    180,

                    100,

                    140,

                    0.22

                );

        }





        .video-btn {



            border-color: #ff9fc1;



            color: #ed5d91;

        }





        .message-btn {



            border-color: #ffd06d;



            color: #efa91c;

        }





        .album-btn {



            border-color: #c5a4ff;



            color: #8e62d6;

        }





        .cake-btn {



            border-color: #72cfff;



            color: #36a9e8;

        }





        /* =========================================================

           CONFETTI

        ========================================================= */



        .confetti {



            position: fixed;



            top: -30px;



            width: 10px;



            height: 18px;



            z-index: 20000;



            pointer-events: none;



            animation:

                confettiFall

                linear

                forwards;

        }





        @keyframes confettiFall {



            to {



                transform:



                    translateY(115vh)



                    translateX(

                        var(--drift)

                    )



                    rotate(900deg);



                opacity: 0;

            }



        }





        /* =========================================================

           MODAL

        ========================================================= */



        .modal {



            position: fixed;



            inset: 0;



            z-index: 10000;



            display: none;



            justify-content: center;



            align-items: center;



            padding: 20px;



            background:

                rgba(

                    67,

                    35,

                    55,

                    0.58

                );



            backdrop-filter:

                blur(8px);

        }





        .modal.show {

            display: flex;

        }





        .modal-card {



            position: relative;



            width:

                min(

                    850px,

                    95vw

                );



            max-height: 92vh;



            overflow-y: auto;



            padding: 30px;



            border-radius: 32px;



            background:



                linear-gradient(

                    145deg,

                    #fffdf8,

                    #fff1f7

                );



            border:

                5px

                solid

                #ffb5cf;



            box-shadow:



                0

                25px

                80px

                rgba(

                    60,

                    30,

                    50,

                    0.35

                );



            text-align: center;



            animation:

                modalIn

                0.4s

                ease;

        }





        @keyframes modalIn {



            from {



                opacity: 0;



                transform:

                    scale(0.75)

                    translateY(30px);

            }





            to {



                opacity: 1;



                transform:

                    scale(1)

                    translateY(0);

            }



        }





        /* =========================================================

           CLOSE BUTTON

        ========================================================= */



        .close {



            position: absolute;



            top: 10px;



            right: 15px;



            width: 45px;



            height: 45px;



            border: none;



            border-radius: 50%;



            background: #ed5d91;



            color: white;



            font-size: 30px;



            line-height: 45px;



            cursor: pointer;



            z-index: 20;



            transition:

                0.2s;

        }





        .close:hover {



            transform:

                rotate(10deg)

                scale(1.08);



            background: #e3477f;

        }





        /* =========================================================

           MODAL TITLE

        ========================================================= */



        .modal-title {



            margin:

                0

                0

                20px;



            padding:

                0

                50px;



            color: #ed5d91;



            font-size:

                clamp(

                    1.7rem,

                    5vw,

                    2.8rem

                );

        }





        /* =========================================================

           VIDEO MODAL

        ========================================================= */



        .video-card video {



            display: block;



            width: 100%;



            max-height: 65vh;



            border-radius: 20px;



            background: #111;

        }





        /* =========================================================

           MESSAGE MODAL

        ========================================================= */



        .message-image {



            width: 100%;



            max-height: 70vh;



            object-fit: contain;



            border-radius: 20px;

        }





        /* =========================================================

           CAKE MODAL

        ========================================================= */



        .cake-card {



            width:

                min(

                    700px,

                    95vw

                );



            background:



                radial-gradient(

                    circle at 50% 30%,

                    #fffdf7,

                    #fff0f6

                );



            overflow: hidden;

        }





        /* =========================================================

           CAKE AREA

        ========================================================= */



        .cake-area {



            position: relative;



            width:

                min(

                    550px,

                    90vw

                );



            height: 480px;



            margin:

                0

                auto;



            display: flex;



            justify-content: center;



            align-items: center;

        }





        /* =========================================================

           CAKE IMAGE

        ========================================================= */



        .cake-image {



            width:

                min(

                    470px,

                    82vw

                );



            max-height: 420px;



            object-fit: contain;



            display: block;



            filter:



                drop-shadow(

                    0

                    15px

                    15px

                    rgba(

                        180,

                        80,

                        110,

                        0.15

                    )

                );

        }





        /* =========================================================

           UPDATED NUMBER CANDLES

           NO BOXES

        ========================================================= */



        .candle {



            position: absolute;



            z-index: 6;



            bottom: 350px;



            width: auto;



            height: auto;



            display: block;



            background: transparent;



            border: none;



            border-radius: 0;



            box-shadow: none;



            padding: 0;



            color: #f47fa5;



            font-family:

                "Trebuchet MS",

                Arial,

                sans-serif;



            font-size: 80px;



            font-weight: 900;



            line-height: 1;



            -webkit-text-stroke:

                3px

                #c94e6d;



            paint-order:

                stroke

                fill;



            text-shadow:



                0

                4px

                0

                #b94060,



                0

                7px

                10px

                rgba(

                    180,

                    60,

                    100,

                    0.18

                );



            cursor: pointer;



            user-select: none;



            transition:

                transform

                0.2s

                ease;

        }





        .candle:hover {



            transform:

                scale(1.05);

        }





        .candle-left {



            left:

                calc(

                    50% - 75px

                );

        }





        .candle-right {



            right:

                calc(

                    50% - 75px

                );

        }





        /* =========================================================

           FLAMES

        ========================================================= */



        .flame {



            position: absolute;



            z-index: 8;



            bottom: 425px;



            font-size: 40px;



            cursor: pointer;



            transform-origin:

                bottom

                center;



            filter:



                drop-shadow(

                    0

                    0

                    6px

                    #ffb52e

                )



                drop-shadow(

                    0

                    0

                    12px

                    rgba(

                        255,

                        176,

                        35,

                        0.55

                    )

                );



            animation:

                flameDance

                0.45s

                ease-in-out

                infinite

                alternate;

        }





        .flame-left {



            left:

                calc(

                    50% - 63px

                );

        }





        .flame-right {



            right:

                calc(

                    50% - 63px

                );

        }





        @keyframes flameDance {



            from {



                transform:

                    scale(0.90)

                    rotate(-5deg);

            }





            to {



                transform:

                    scale(1.12)

                    rotate(5deg);

            }



        }





        /* =========================================================

           FLAME OUT

        ========================================================= */



        .flame.out {



            pointer-events: none;



            animation:

                flameOut

                0.45s

                forwards;

        }





        @keyframes flameOut {



            0% {



                opacity: 1;



                transform:

                    scale(1);

            }





            50% {



                opacity: 0.6;



                transform:

                    scale(1.5)

                    translateY(-5px);

            }





            100% {



                opacity: 0;



                transform:

                    scale(2)

                    translateY(-20px);

            }



        }





        /* =========================================================

           WISH BUTTON

        ========================================================= */



        .wish-button {



            border:

                2px

                solid

                #512d40;



            padding:

                15px

                28px;



            min-width:

                min(

                    300px,

                    80vw

                );



            border-radius: 50px;



            background:



                linear-gradient(

                    135deg,

                    #ed5d91,

                    #ff9b72

                );



            color: white;



            font-weight: bold;



            font-size: 17px;



            cursor: pointer;



            box-shadow:



                0

                7px

                18px

                rgba(

                    220,

                    80,

                    130,

                    0.25

                );



            transition:

                transform

                0.2s

                ease,



                box-shadow

                0.2s

                ease;

        }





        .wish-button:hover {



            transform:

                translateY(-3px);



            box-shadow:



                0

                12px

                22px

                rgba(

                    220,

                    80,

                    130,

                    0.30

                );

        }





        /* =========================================================

           WISH MESSAGE

        ========================================================= */



        .wish-text {



            color: #8a5871;



            font-size: 15px;



            margin-top: 18px;

        }





        /* =========================================================

           MOBILE

        ========================================================= */



        @media (max-width: 750px) {



            .button-grid {



                grid-template-columns:

                    repeat(

                        2,

                        1fr

                    );



                gap: 12px;

            }





            .menu-btn {



                min-height: 105px;



                font-size: 38px;

            }





            .menu-btn span {



                font-size: 14px;

            }





            .balloon {



                font-size: 45px;

            }





            .hero {



                padding-top: 45px;

            }





            .modal-card {



                padding:

                    25px

                    15px;

            }





            .modal-title {



                padding:

                    0

                    45px;



                font-size: 1.8rem;

            }





            .cake-area {



                height: 400px;



                width: 100%;

            }





            .cake-image {



                width:

                    min(

                        410px,

                        90vw

                    );



                max-height: 360px;

            }





            .candle {



                bottom: 295px;



                font-size: 65px;



                -webkit-text-stroke:

                    2px

                    #c94e6d;

            }





            .candle-left {



                left:

                    calc(

                        50% - 62px

                    );

            }





            .candle-right {



                right:

                    calc(

                        50% - 62px

                    );

            }





            .flame {



                bottom: 355px;



                font-size: 34px;

            }





            .flame-left {



                left:

                    calc(

                        50% - 53px

                    );

            }





            .flame-right {



                right:

                    calc(

                        50% - 53px

                    );

            }



        }





        /* =========================================================

           SMALL PHONES

        ========================================================= */



        @media (max-width: 450px) {



            .hero {



                min-height: 560px;

            }





            .celebrant-frame {



                width: 65vw;



                height: 75vw;

            }





            .birthday-title {



                margin-top: 25px;

            }





            .button-grid {



                width: 94vw;

            }





            .menu-btn {



                min-height: 95px;



                border-radius: 22px;



                font-size: 32px;

            }





            .music-player {



                padding:

                    10px

                    14px;

            }





            .music-control {



                width: 42px;



                height: 42px;

            }





            .cake-area {



                height: 350px;

            }





            .cake-image {



                width: 330px;



                max-height: 315px;

            }





            .candle {



                bottom: 260px;



                font-size: 56px;

            }





            .candle-left {



                left:

                    calc(

                        50% - 53px

                    );

            }





            .candle-right {



                right:

                    calc(

                        50% - 53px

                    );

            }





            .flame {



                bottom: 312px;



                font-size: 30px;

            }





            .flame-left {



                left:

                    calc(

                        50% - 45px

                    );

            }





            .flame-right {



                right:

                    calc(

                        50% - 45px

                    );

            }





            .wish-button {



                font-size: 14px;



                min-width: 250px;

            }



        }



    
/* FINAL FIX: raise and center the 29 candles above the cake */
.cake-area { overflow: visible; }
.candle { bottom: 405px; z-index: 10; }
.candle-left { left: calc(50% - 58px); right: auto; }
.candle-right { right: calc(50% - 58px); left: auto; }
.flame { bottom: 480px; z-index: 11; }
.flame-left { left: calc(50% - 51px); right: auto; }
.flame-right { right: calc(50% - 51px); left: auto; }

  .candle { bottom: 340px; }
  .candle-left { left: calc(50% - 48px); }
  .candle-right { right: calc(50% - 48px); }
  .flame { bottom: 400px; }
  .flame-left { left: calc(50% - 43px); }

    <script>





        /* =========================================================

           ELEMENTS

        ========================================================= */



        const intro =

            document.getElementById(

            );





        const mainPage =

            document.getElementById(

                "mainPage"

            );





        const tapButton =

            document.getElementById(

                "tapButton"

            );





        const introSong = document.getElementById("introSong");
        let activeSong = introSong;

        const birthdaySong =

            document.getElementById(

                "birthdaySong"

            );





        const musicControl =

            document.getElementById(

                "musicControl"

            );







        /* =========================================================

           CONFETTI

        ========================================================= */



        function createConfetti(

            amount = 180

        ) {





            const colors = [



                "#ff5c91",



                "#ffc83d",



                "#65c9ff",



                "#a77bff",



                "#6fe3a1",



                "#ff8d6b"



            ];





            for (

                let i = 0;

                i < amount;

                i++

            ) {





                const confetti =

                    document.createElement(

                        "div"

                    );





                confetti.className =

                    "confetti";





                confetti.style.left =

                    Math.random() *

                    100 +

                    "vw";





                confetti.style.background =

                    colors[

                        Math.floor(

                            Math.random() *

                            colors.length

                        )

                    ];





                confetti.style.setProperty(



                    "--drift",



                    (

                        (

                            Math.random() -

                            0.5

                        ) *

                        50

                    ) +

                    "vw"



                );





                confetti.style.animationDuration =

                    (

                        2 +

                        Math.random() *

                        4

                    ) +

                    "s";





                confetti.style.animationDelay =

                    Math.random() *

                    0.8 +

                    "s";





                document.body.appendChild(

                    confetti

                );





                setTimeout(

                    () => {



                        confetti.remove();



                    },



                    7000

                );





            }



        }







        /* =========================================================

           CONFETTI SOUND

        ========================================================= */



        function playConfettiSound() {





            const AudioContextClass =



                window.AudioContext ||



                window.webkitAudioContext;





            if (!AudioContextClass) {

                return;

            }





            const audioContext =

                new AudioContextClass();





            const duration =

                0.8;





            const bufferSize =

                audioContext.sampleRate *

                duration;





            const buffer =

                audioContext.createBuffer(



                    1,



                    bufferSize,



                    audioContext.sampleRate



                );





            const data =

                buffer.getChannelData(

                    0

                );





            for (

                let i = 0;

                i < bufferSize;

                i++

            ) {





                const fade =

                    1 -

                    (

                        i /

                        bufferSize

                    );





                data[i] =



                    (

                        Math.random() *

                        2 -

                        1

                    )



                    *



                    fade;



            }





            const source =

                audioContext

                    .createBufferSource();





            source.buffer =

                buffer;





            const filter =

                audioContext

                    .createBiquadFilter();





            filter.type =

                "bandpass";





            filter.frequency.value =

                1800;





            filter.Q.value =

                0.7;





            const gain =

                audioContext

                    .createGain();





            gain.gain.setValueAtTime(



                0.001,



                audioContext.currentTime



            );





            gain.gain

                .exponentialRampToValueAtTime(



                    0.45,



                    audioContext.currentTime +

                    0.02



                );





            gain.gain

                .exponentialRampToValueAtTime(



                    0.001,



                    audioContext.currentTime +

                    duration



                );





            source

                .connect(filter)

                .connect(gain)

                .connect(

                    audioContext.destination

                );





            source.start();





            source.stop(



                audioContext.currentTime +

                duration



            );



        }







        /* =========================================================

           OPEN BIRTHDAY PAGE

        /* =========================================================

        document

                        );

            );







        /* =========================================================

           CLICK OUTSIDE MODAL TO CLOSE

        document

            .forEach(

                modal => {





                    modal

                        .addEventListener(



                            "click",



                            function (

                                event

                            ) {





                                if (

                                    event.target ===

                                    this

                                ) {





                                    this

                                        .classList

                                        .remove(

                                            "show"

                                        );





                                    const video =

                                        this.querySelector(

                                            "video"

                                        );





                                    if (video) {





                                        video.pause();





                                    }





                                }





                            }



                        );





                }

            );







        /* =========================================================

           PHOTO ALBUM

        ========================================================= */



        document

            .getElementById(

                "albumButton"

            )

        /* =========================================================

           CAKE ELEMENTS

        ========================================================= */



        const flameLeft =

            document.getElementById(

                "flameLeft"

            );





        const flameRight =

            document.getElementById(

                "flameRight"

            );





        const candleLeft =

            document.getElementById(

                "candleLeft"

            );





        const candleRight =

            document.getElementById(

                "candleRight"

            );





        const wishButton =

            document.getElementById(

                "wishButton"

            );





        const wishText =

            document.getElementById(

                "wishText"

            );





        let candlesOut =

            false;







        /* =========================================================

           BLOW CANDLES

        ========================================================= */



        function blowCandles() {





            if (

                !candlesOut

            ) {





                /* TURN FLAMES OFF */



                flameLeft

                    .classList

                    .add(

                        "out"

                    );





                flameRight

                    .classList

                    .add(

                        "out"

                    );





                candlesOut =

                    true;







                /* CONFETTI */



                createConfetti(

                    100

                );







                /* CONFETTI SOUND */



                playConfettiSound();







                /* SWITCH FROM INTRO MUSIC TO BIRTHDAY SONG */
                introSong.pause();
                introSong.currentTime = 0;
                activeSong = birthdaySong;

                /* RESTART HAPPY BIRTHDAY SONG */



                birthdaySong.currentTime =

                    0;





                birthdaySong

                    .play()



                    .then(

                        () => {





                            musicControl.textContent =

                                "❚❚";





                        }

                    )



                    .catch(

                        error => {





                            console.log(



                                "Birthday song could not play:",



                                error



                            );





                        }

                    );







                /* UPDATE TEXT */



                wishButton.textContent =

                    "Light the candles again 🕯️";





                wishText.textContent =

                    "Wish made! Happy 29th Birthday, Angelu! 💕";





            }



            else {





                /* TURN FLAMES BACK ON */



                flameLeft

                    .classList

                    .remove(

                        "out"

                    );





                flameRight

                    .classList

                    .remove(

                        "out"

                    );





                candlesOut =

                    false;







                wishButton.textContent =

                    "Tap the flames ✨";





                wishText.textContent =

                    "Make a wish and tap the flames to blow out the candles! 🕯️";





            }





        }







        /* =========================================================

           CLICK FLAMES

        ========================================================= */



        flameLeft

            .addEventListener(



                "click",



                blowCandles



            );





        flameRight

            .addEventListener(



                "click",



                blowCandles



            );







        /* =========================================================

           CLICK NUMBER 2 OR 9

        ========================================================= */



        candleLeft

            .addEventListener(



                "click",



                blowCandles



            );





        candleRight

            .addEventListener(



                "click",



                blowCandles



            );







        /* =========================================================

           BUTTON ALSO BLOWS/LIGHTS CANDLES

        ========================================================= */



        wishButton

            .addEventListener(



                "click",



                blowCandles



            );





    </script>
